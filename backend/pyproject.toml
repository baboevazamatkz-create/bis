[project]
name = "bis"
version = "0.1.0"
description = "BIS — ИИ-платформа автоматизации строительных компаний"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-docx>=1.1",
  "docxtpl>=0.18",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "ezdxf>=1.3",
  "pillow>=10",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=2.6"]

[project.scripts]
bis = "bis.cli:main"

[project.entry-points."bis.plugins"]
core = "bis.plugins.core:CorePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bis"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["bis/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
