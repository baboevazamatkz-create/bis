name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bis_test_admin
          POSTGRES_PASSWORD: disposable-ci-admin
          POSTGRES_DB: bis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bis_test_admin -d bis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest guard_tests
      - name: Provision disposable PostgreSQL
        shell: bash
        env:
          BIS_TEST_ADMIN_PASSWORD: disposable-ci-admin
        run: |
          export BIS_TEST_DB_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          export BIS_TEST_RUNNER_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          printf '::add-mask::%s\n' "$BIS_TEST_RUNNER_PASSWORD"
          python scripts/provision_test_database.py --port 5432
          {
            printf 'BIS_TEST_DB_ID=%s\n' "$BIS_TEST_DB_ID"
            printf 'TEST_DATABASE_URL=postgresql+psycopg://bis_test_runner:%s@127.0.0.1:5432/bis_test\n' "$BIS_TEST_RUNNER_PASSWORD"
            printf 'BIS_VECTOR_ENABLED=true\n'
          } >> "$GITHUB_ENV"
      - name: Verify PostgreSQL isolation and pgvector
        run: pytest -v tests/test_database_boundary.py
      - name: Run backend suite
        run: pytest tests
      - run: ruff check bis tests guard_tests scripts/provision_test_database.py
        if: ${{ !cancelled() }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
