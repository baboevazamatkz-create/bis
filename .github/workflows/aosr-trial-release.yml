name: Publish BIS Project Structure and AOSR Windows trial

on:
  push:
    branches: [codex/aosr-trial-release]
    paths:
      - '.github/workflows/aosr-trial-release.yml'
      - '.github/scripts/aosr-trial/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-structure-aosr-331f56a

env:
  SOURCE_SHA: 331f56a9e7514987058be1f7d9d7585c5b40ef0c
  TRIAL_TAG: project-structure-aosr-331f56a

jobs:
  bundle:
    if: github.ref == 'refs/heads/codex/aosr-trial-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 331f56a9e7514987058be1f7d9d7585c5b40ef0c
          path: bis-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the tested revision and offline Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/aosr-bundle"
          stage="$RUNNER_TEMP/aosr-stage"
          mkdir -p "$output" "$stage"
          test "$(git -C bis-source rev-parse HEAD)" = "$SOURCE_SHA"
          npm --prefix bis-source/frontend ci
          VITE_DEMO=0 npm --prefix bis-source/frontend run build
          python bis-source/deploy/package-pilot.py "$stage"
          python .github/scripts/aosr-trial/dependencies.py "$stage"
          python -m pip wheel --no-deps --wheel-dir "$stage/wheels" ./bis-source/backend
          python -m pip install ./bis-source/backend
          python .github/scripts/aosr-trial/sample.py "$GITHUB_WORKSPACE/bis-source" "$output"
          python .github/scripts/aosr-trial/bundle.py "$stage" "$GITHUB_WORKSPACE/bis-source" "$output"
          cp "$stage/BIS-Project-Structure-AOSR-Windows11.zip" "$output/"
          (cd "$output" && sha256sum BIS-Project-Structure-AOSR-Windows11.zip > BIS-Project-Structure-AOSR-Windows11.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: bis-aosr-windows-trial
          path: |
            ${{ runner.temp }}/aosr-bundle/BIS-Project-Structure-AOSR-Windows11.zip
            ${{ runner.temp }}/aosr-bundle/BIS-Project-Structure-AOSR-Windows11.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for CI on the merged revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in {1..15}; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch codex/project-structure \
              --commit "$SOURCE_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - uses: actions/download-artifact@v4
        with:
          name: bis-aosr-windows-trial
      - name: Publish the verified prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c BIS-Project-Structure-AOSR-Windows11.zip.sha256
          if gh release view "$TRIAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TRIAL_TAG already exists. Inspect it before updating any assets."
            exit 1
          fi
          gh release create "$TRIAL_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --latest=false \
            --title "BIS · Структура проекта и АОСР · пробная сборка Windows" \
            --notes 'Закройте работающую пробную копию BIS. Извлеките весь BIS-Project-Structure-AOSR-Windows11.zip, затем дважды щёлкните Install-BIS.cmd. Пробная копия использует C:\BIS-AOSR-Trial и http://localhost:8082. В папке «Примеры» лежат два учебных бланка и заполненный DOCX. Данные и настройки существующей пробной копии сохраняются. Установщик проверен на облачном стенде, запуск под Windows отдельно не проверен.'
          gh release upload "$TRIAL_TAG" BIS-Project-Structure-AOSR-Windows11.zip BIS-Project-Structure-AOSR-Windows11.zip.sha256 --repo "$GITHUB_REPOSITORY"
          gh release edit "$TRIAL_TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
